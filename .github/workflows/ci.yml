name: CI/CD pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test:ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME  }}
          password: ${{ secrets.DOCKERHUB_TOKEN  }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            jeremymacu/ai-resume-tailor:latest
            jeremymacu/ai-resume-tailor:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USERNAME }}
            key: ${{ secrets.EC2_SSH_KEY }}
            script: |
                docker pull jeremymacu/ai-resume-tailor:latest
                docker stop ai-resume-tailor || true
                docker rm ai-resume-tailor || true
                docker run -d --restart unless-stopped -p 3001:3000 --env-file .env.art --name ai-resume-tailor jeremymacu/ai-resume-tailor:latest
                docker image prune -f
